name: NMT
on:
  push:
    branches: [wysokosci]
    paths: [pobierz_nmt.py, .github/workflows/nmt.yml]
permissions:
  contents: write
jobs:
  nmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rasterio pyproj requests numpy
      - name: Stary model (dawny obszar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nmt -R ${{ github.repository }} -p nmt.npz -O stary.npz || true
      - run: python pobierz_nmt.py
        timeout-minutes: 150
      - name: Wydanie z danymi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          gh release delete nmt2 -R ${{ github.repository }} -y --cleanup-tag || true
          gh release create nmt2 -R ${{ github.repository }} --target wysokosci --title "Model terenu – powiększony obszar (dane robocze)" --notes "NMT GUGiK (siatka 5 m), Blachownia – Tarnowskie Góry, Lubliniec – Woźniki." --prerelease log.txt $(ls nmt.npz 2>/dev/null)
