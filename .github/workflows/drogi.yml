name: Drogi OSM
on:
  push:
    branches: [wysokosci]
    paths: [pobierz_drogi.py, .github/workflows/drogi.yml]
permissions:
  contents: write
jobs:
  podklad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests shapely osm2geojson
      - run: python pobierz_drogi.py
        timeout-minutes: 180
      - name: Wydanie z danymi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete drogi -y --cleanup-tag || true
          gh release create drogi --target wysokosci --title "Drogi OSM – powiększony obszar (dane robocze)" --notes "Dane © współtwórcy OpenStreetMap (ODbL): drogi, obiekty i granice gmin dla mapy wspólnej i nawigacji Jedź." --prerelease log_drogi.txt osm_obszar.geojson
