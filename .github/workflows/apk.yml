# Buduje aplikację „Jedź” na Androida (APK do instalacji poza sklepem) i dodaje ją do wydań na GitHubie.
# Uruchamia się po każdej publikacji strony (gałąź `strona`) albo ręcznie (Actions → „APK Jedź” → Run workflow).
name: APK Jedź
on:
  workflow_dispatch:
  push:
    branches: [strona]
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      # klucz do Sklepu Play – sekrety repozytorium (Settings → Secrets and variables → Actions); bez nich powstaje tylko APK
      PLAY_KS: ${{ secrets.PLAY_KEYSTORE_B64 }}
      PLAY_KS_PASS: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
      PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - name: Kod aplikacji (main)
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Opublikowana strona (strona)
        uses: actions/checkout@v5
        with:
          ref: strona
          path: _strona
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalowany na runnerze)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Zależności i pliki aplikacji
        working-directory: aplikacja
        run: |
          npm install --no-audit --no-fund
          bash przygotuj.sh ../_strona/public
      - name: Projekt Androida
        working-directory: aplikacja
        run: |
          npx cap add android
          bash uprawnienia.sh
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#f7f4ec'
          npx cap sync android
          # numer wersji = numer budowania
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Budowanie APK
        working-directory: aplikacja/android
        run: |
          mkdir -p ~/.android && cp ../beta-debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../jedz-hub-strzebin.apk
      - name: AAB do Sklepu Play (gdy są sekrety z kluczem)
        if: env.PLAY_KS != ''
        working-directory: aplikacja/android
        run: |
          echo "$PLAY_KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" -Pandroid.injected.signing.store.password="$PLAY_KS_PASS" \
            -Pandroid.injected.signing.key.alias="$PLAY_KEY_ALIAS" -Pandroid.injected.signing.key.password="$PLAY_KEY_PASS"
          cp app/build/outputs/bundle/release/app-release.aab ../../jedz-hub-strzebin-${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: AAB jako artefakt (do wgrania w konsoli Play)
        if: hashFiles('*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jedz-aab-play
          path: "*.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: jedz-apk
          path: jedz-hub-strzebin.apk
      - name: Wydanie na GitHubie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jedz-0.1.${{ github.run_number }}
          name: "Jedź – aplikacja na Androida 0.1.${{ github.run_number }} (beta)"
          make_latest: true
          files: jedz-hub-strzebin.apk
          body: |
            Nawigacja rowerowa HUB Strzebiń – wersja testowa do instalacji poza Sklepem Play.

            **Instalacja:** pobierz plik `jedz-hub-strzebin.apk` na telefonie, otwórz go i zezwól na instalację z tego źródła.
            Przy pierwszym prowadzeniu zezwól na lokalizację i powiadomienia – dzięki temu nawigacja działa też na zgaszonym ekranie.

            Zbudowano z opublikowanej strony (commit ${{ github.sha }}).
